name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/CryptoTaxHelper.sln
      - name: Build
        run: dotnet build backend/CryptoTaxHelper.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/CryptoTaxHelper.sln --no-build --configuration Release

  frontend:
    name: Frontend install, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  container-smoke:
    name: Build and smoke-test staging containers
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_IMAGE: ghcr.io/local/coinmotion-transaction-helper-api:ci-${{ github.run_id }}
      WEB_IMAGE: ghcr.io/local/coinmotion-transaction-helper-web:ci-${{ github.run_id }}
      STAGING_PORT: "18080"
      REPORT_RETENTION_MINUTES: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and start staging stack
        run: |
          if ! docker compose --file deploy/staging/compose.yaml up --detach --build --wait --wait-timeout 120; then
            docker compose --file deploy/staging/compose.yaml ps --all
            docker compose --file deploy/staging/compose.yaml logs --no-color
            exit 1
          fi
      - name: Exercise the complete staging path with synthetic data
        run: |
          if ! tests/smoke/container-smoke.sh; then
            docker compose --file deploy/staging/compose.yaml ps --all
            docker compose --file deploy/staging/compose.yaml port web 8080 || true
            docker compose --file deploy/staging/compose.yaml logs --no-color
            docker inspect "$(docker compose --file deploy/staging/compose.yaml ps --quiet web)" --format '{{json .NetworkSettings.Ports}}' || true
            ss -lnt '( sport = :18080 )' || true
            exit 1
          fi
      - name: Stop staging stack
        if: always()
        run: docker compose --file deploy/staging/compose.yaml down --volumes --remove-orphans

  publish-images:
    name: Publish public-staging image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
      - name: Normalize GHCR owner
        id: repo
        run: echo "owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/coinmotion-transaction-helper-api:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/coinmotion-transaction-helper-api:test
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/coinmotion-transaction-helper-web:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/coinmotion-transaction-helper-web:test
